name: Signed release
on:
  push:
    tags: ['v*']
permissions: {}
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -v
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac
      - run: |
          set -eu
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-preview\.[0-9]+)?$ ]]
          release/build.sh dist
          cosign sign-blob --yes --bundle dist/lycatra-desktop.sigstore.json dist/lycatra-desktop.tar.gz
          cosign verify-blob --bundle dist/lycatra-desktop.sigstore.json --certificate-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@$GITHUB_REF" --certificate-oidc-issuer https://token.actions.githubusercontent.com dist/lycatra-desktop.tar.gz
          flags=()
          if [[ "$GITHUB_REF_NAME" == *-preview.* ]]; then flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes "${flags[@]}" dist/*
        env:
          GH_TOKEN: ${{ github.token }}
